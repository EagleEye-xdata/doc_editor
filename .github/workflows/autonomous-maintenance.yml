name: Scheduled Codex maintenance

on:
  schedule:
    # 09:00, 12:00, 15:00, 18:00, and 22:00 Asia/Kolkata (UTC+05:30).
    - cron: "30 3,6,9,12,16 * * *"
  workflow_dispatch:
    inputs:
      focus:
        description: Optional bounded maintenance focus
        required: false
        type: string
        default: general maintenance

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  maintenance:
    uses: EagleEye-xdata/EagleEye-xdata/.github/workflows/reusable-autonomous-maintenance.yml@main
    with:
      project_name: Collaborative document editor
      validation_commands: |
        npm ci
        npm run build
      allowed_path_pattern: '^(src/|tests/|scripts/|README\.md$|docs/|\.codex/development-state\.json$)'
      project_context: Preserve CRDT convergence, offline-first behavior, and the existing collaboration protocol. Do not modify server.js, database/persistence configuration, deployment files, or authentication behavior.
      focus: ${{ inputs.focus || 'general maintenance' }}
      delivery_mode: direct
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
